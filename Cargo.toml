[package]
name = "guialar"
version = "0.2.1"
edition = "2021"
authors = ["Guilherme Amaral Colamarco Resende de Melo <guicolamarco150@gmail.com>"]
description = "Proteção familiar de navegação via DNS Cloudflare Family e instalador uBlock Origin para Linux (NetworkManager, systemd-resolved, runit/resolvconf) e Windows"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "color"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

[target.'cfg(windows)'.dependencies]
